name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Stable key from secrets keeps updates installable and the Google Drive OAuth SHA-1 fixed.
      # Without secrets every build gets a throwaway key (updates need an uninstall; Google sign-in won't match).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.p12
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret not set, using a throwaway signing key"
            keytool -genkeypair -keystore app/release.p12 -storetype PKCS12 -storepass throwaway \
              -alias folio -keyalg RSA -keysize 2048 -validity 10000 -dname CN=Folio
            echo "KEYSTORE_PASSWORD=throwaway" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - run: cp app/build/outputs/apk/release/app-release.apk folio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: folio.apk

      - name: Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" folio.apk \
            --title "Folio 2.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install folio.apk on Android 8+." \
            --latest
